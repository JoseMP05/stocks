<section class="panel settings" aria-labelledby="settings-title">
  <h2 class="label" id="settings-title">Configuración de IA</h2>

  {% if saved %}
    <p class="saved-notice" role="status">Guardado.</p>
  {% endif %}

  <form class="settings-form" hx-post="/settings" hx-target="closest .settings" hx-swap="outerHTML">
    <label>Proveedor
      <select name="provider">
        <option value="anthropic" {% if settings.provider == "anthropic" %}selected{% endif %}>Anthropic</option>
        <option value="openai" {% if settings.provider == "openai" %}selected{% endif %}>OpenAI</option>
        <option value="openrouter" {% if settings.provider == "openrouter" %}selected{% endif %}>OpenRouter</option>
      </select>
    </label>
    <label>Modelo
      <input type="text" name="model" value="{{ settings.model }}" required>
    </label>
    <label>API key
      <input type="password" name="api_key"
             placeholder="{% if settings.api_key %}••••••••{% else %}sk-…{% endif %}"
             autocomplete="off">
    </label>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </form>
</section>
